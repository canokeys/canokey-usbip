name: Compatibility infrastructure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcmocka-dev libssl-dev python3-jinja2 python3-jsonschema shellcheck

      - name: Check scripts and Python runner
        run: |
          shellcheck compat/run compat/build compat/environment compat/list-firmwares compat/scripts/*.sh
          python3 -m compileall -q compat/runner compat/tests
          python3 -m unittest discover -s compat/tests -v
          git diff --check

      - name: Build against the latest mapped release core
        run: |
          ./compat/build \
            --core-ref e558d5cc6169acca1508238f7b584b8e00f8786d \
            --output-dir "$PWD/artifacts/build"

      - name: Install Rust firmware toolchain
        run: rustup toolchain install nightly-2026-09-04 --profile minimal

      - name: Build Rust firmware 4.0.0 and test CCID wire behavior
        run: |
          ./compat/build --core-ref 4.0.0 --output-dir "$PWD/artifacts/rust-build" --build-dir "$PWD/build/rust4"
          python3 tests/rust_ccid.py "$PWD/build/rust4/canokey-usbip"

      - name: Test current virtual NFC enable protocol
        run: |
          cmake -S . -B build/protocol \
            -DENABLE_TESTS=ON \
            -DCANOKEY_FIRMWARE_VERSION=3.1.0
          cmake --build build/protocol --target canokey-usbip-nfc-enable-test --parallel
          ctest --test-dir build/protocol -R '^nfc-enable-protocol$' --output-on-failure

      - name: Test CanoKey 3.0.0 NFC enable protocol
        run: |
          git clone --branch 3.0.0 --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/canokeys/canokey-core.git "$RUNNER_TEMP/canokey-core-3.0.0"
          cmake -S . -B build/protocol-3.0.0 \
            -DENABLE_TESTS=ON \
            -DCANOKEY_CORE_DIR="$RUNNER_TEMP/canokey-core-3.0.0" \
            -DCANOKEY_FIRMWARE_VERSION=3.0.0
          cmake --build build/protocol-3.0.0 --target canokey-usbip-nfc-enable-test --parallel
          ctest --test-dir build/protocol-3.0.0 -R '^nfc-enable-protocol$' --output-on-failure

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-build
          path: artifacts/build/
          if-no-files-found: warn
