name: Compatibility infrastructure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake python3-jinja2 python3-jsonschema shellcheck

      - name: Check scripts and Python runner
        run: |
          shellcheck compat/run compat/build compat/environment compat/list-firmwares compat/scripts/*.sh
          python3 -m compileall -q compat/runner compat/tests
          python3 -m unittest discover -s compat/tests -v
          git diff --check

      - name: Build against the pinned development core
        run: |
          ./compat/build \
            --core-dir "$PWD/canokey-core" \
            --output-dir "$PWD/artifacts/build"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-build
          path: artifacts/build/
          if-no-files-found: warn
