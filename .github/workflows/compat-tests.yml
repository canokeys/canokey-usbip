name: Compatibility infrastructure checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build and lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libcmocka-dev python3-jinja2 python3-jsonschema shellcheck

      - name: Check scripts and Python runner
        run: |
          shellcheck compat/run compat/build compat/environment compat/list-firmwares compat/scripts/*.sh
          python3 -m compileall -q compat/runner compat/tests
          python3 -m unittest discover -s compat/tests -v
          git diff --check

      - name: Build against the latest mapped release core
        run: |
          ./compat/build \
            --core-ref aeacc59f8ff29976c0b3870493175e469dc234b1 \
            --output-dir "$PWD/artifacts/build"

      - name: Test virtual NFC enable protocol
        run: |
          cmake -S . -B build/protocol \
            -DENABLE_TESTS=ON \
            -DCANOKEY_FIRMWARE_VERSION=3.1.0
          cmake --build build/protocol --target canokey-usbip-nfc-enable-test --parallel
          ctest --test-dir build/protocol -R '^nfc-enable-protocol$' --output-on-failure

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compat-build
          path: artifacts/build/
          if-no-files-found: warn
